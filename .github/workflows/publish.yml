---
name: Publish Node

on:
  workflow_call:
    inputs:
      pre_release:
        default: false
        type: boolean
        description: Publish with the npm beta tag
    secrets:
      NPM_TOKEN:
        required: false
        description: One-time token used to bootstrap the package before trusted publishing

jobs:
  publish:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Validate release version
        shell: bash
        run: |
          package_version=$(node --print "require('./package.json').version")
          release_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$release_version" ]]; then
            echo "package.json version $package_version does not match release $release_version"
            exit 1
          fi
      - name: Publish with bootstrap token
        if: ${{ env.NPM_TOKEN != '' }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          if [[ "${{ inputs.pre_release }}" == "true" ]]; then
            npm publish --tag beta --provenance
          else
            npm publish --provenance
          fi
      - name: Publish with trusted publisher
        if: ${{ env.NPM_TOKEN == '' }}
        shell: bash
        run: |
          if [[ "${{ inputs.pre_release }}" == "true" ]]; then
            npm publish --tag beta
          else
            npm publish
          fi
